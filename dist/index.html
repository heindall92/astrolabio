/* =====================================================================
   Astrolabio · superficies lisas, tinta de alto contraste y un acento.
   Oro estelar solo para lo que se gana (XP, estrellas, rangos, insignias).
   ===================================================================== */
:root {
  color-scheme: light;
  --bg: #f3f5f7; --s1: #ffffff; --s2: #eef1f4; --s3: #e2e6eb;
  --ink: #101418; --ink-2: #2c3440; --ink-3: #5c6773;
  --line: #d5dbe2; --line-2: #c3cad3;
  --accent: #1a4fe0; --on-accent: #ffffff;
  --star: #ffc233; --star-ink: #241a00; --star-text: #7a4b00;
  --night: #0b1024; --canvas: #f2f4fb; --canvas-ink: #1c2547;
  --ok: #1a6b36; --warn: #8a4a00; --crit: #b3141a;
  --glass: rgba(255,255,255,.78);
  --shadow: 0 1px 2px rgba(16,20,24,.06), 0 8px 24px -12px rgba(16,20,24,.14);
  --shadow-lg: 0 2px 6px rgba(16,20,24,.06), 0 28px 60px -24px rgba(16,20,24,.28);
  --f: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-display: "Sora", "Geist", ui-sans-serif, system-ui, sans-serif;
  --ease-out: cubic-bezier(.23,1,.32,1);
  --ease-in-out: cubic-bezier(.77,0,.175,1);
  --ease-drawer: cubic-bezier(.32,.72,0,1);
  --r-sm: 10px; --r: 14px; --r-lg: 20px;
  --side-w: 248px;
}
:root[data-accent="rosa"] { --accent: #b8155a; }
:root[data-accent="solar"] { --accent: #8a4a00; }
:root[data-accent="glaciar"] { --accent: #0a6a7d; }
:root[data-accent="orquidea"] { --accent: #5b35f0; }
:root[data-accent="verde"] { --accent: #1a6b36; }
:root[data-accent="rojo"] { --accent: #b3141a; }

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #08090b; --s1: #111317; --s2: #171a1f; --s3: #1e2228;
  --ink: #eef1f3; --ink-2: #a3aab2; --ink-3: #8f97a0;
  --line: #262b33; --line-2: #343a44;
  --accent: #6b9bff; --on-accent: #08090b;
  --star: #ffcf4d; --star-ink: #241a00; --star-text: #ffcf4d;
  --canvas: #0b1024; --canvas-ink: #e9edff;
  --ok: #6fcf8a; --warn: #ffb020; --crit: #ff6b6b;
  --glass: rgba(17,19,23,.78);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg: 0 1px 0 rgba(255,255,255,.04) inset, 0 30px 70px -24px rgba(0,0,0,.85);
}
:root[data-theme="dark"][data-accent="rosa"] { --accent: #ff7ab8; }
:root[data-theme="dark"][data-accent="solar"] { --accent: #ffb020; }
:root[data-theme="dark"][data-accent="glaciar"] { --accent: #5ee7f5; }
:root[data-theme="dark"][data-accent="orquidea"] { --accent: #b79bff; }
:root[data-theme="dark"][data-accent="verde"] { --accent: #5aa86a; }
:root[data-theme="dark"][data-accent="rojo"] { --accent: #ff6b6b; }

/* Cambio de tema: un único fundido para todo, misma duración y misma curva. */
:root.theme-fade, :root.theme-fade *, :root.theme-fade *::before, :root.theme-fade *::after {
  transition: background-color .32s var(--ease-in-out), color .32s var(--ease-in-out), border-color .32s var(--ease-in-out), fill .32s var(--ease-in-out), stroke .32s var(--ease-in-out), box-shadow .32s var(--ease-in-out) !important;
}

/* ============ Base ============ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 400 .9375rem/1.55 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
h1 { font: 650 clamp(1.75rem, 3.2vw, 2.5rem)/1.1 var(--f-display); letter-spacing: -.025em; }
h2 { font-size: 1.2rem; line-height: 1.25; }
h3 { font-size: 1rem; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.2em; }
kbd { font: 500 .75rem var(--f-mono); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--s2); color: var(--ink-2); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; }
.ic { flex: none; width: 20px; height: 20px; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 24px; height: 24px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 100; padding: 10px 14px; border-radius: 10px; background: var(--s1); color: var(--ink); box-shadow: var(--shadow-lg); }
.skip:focus { left: 12px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font: 500 .72rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }

/* ============ Botones ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--s1); color: var(--ink); font-weight: 550; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .16s var(--ease-out), background-color .16s var(--ease-out), border-color .16s var(--ease-out); }
.btn:hover { background: var(--s2); }
.btn:active, .icon-btn:active, .nav a:active, .chip:active, .choice:active, .tab:active, .swatch:active, .card.link:active, .bnav a:active, .bnav button:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover { background: color-mix(in oklab, var(--accent) 88%, var(--ink)); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--s2); }
.btn.danger { color: var(--crit); border-color: color-mix(in oklab, var(--crit) 45%, var(--line)); }
.btn.danger.solid { background: var(--crit); color: #fff; border-color: transparent; }
:root[data-theme="dark"] .btn.danger.solid { color: #08090b; }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: .875rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; transition: transform .16s var(--ease-out), background-color .16s var(--ease-out), color .16s; }
.icon-btn:hover { background: var(--s2); color: var(--ink); }
.icon-btn[aria-pressed="true"] { color: var(--accent); }

/* ============ Layout ============ */
.app { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100dvh; transition: grid-template-columns .28s var(--ease-drawer); }
.app.collapsed { grid-template-columns: 0 1fr; }
.side { position: sticky; z-index: 50; top: 0; height: 100dvh; padding: 12px 0 12px 12px; overflow: hidden; }
.side-in { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 16px 12px; border-radius: var(--r-lg); background: var(--s1); border: 1px solid var(--line); box-shadow: var(--shadow); width: calc(var(--side-w) - 12px); transition: opacity .2s var(--ease-out), transform .28s var(--ease-drawer); }
.app.collapsed .side-in { opacity: 0; transform: translateX(-16px); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; text-decoration: none; color: var(--ink); }
.brand svg { width: 36px; height: 36px; flex: none; }
.wordmark { display: flex; flex-direction: column; line-height: 1.05; }
.wordmark b { font: 650 1.15rem var(--f-display); letter-spacing: -.02em; }
.wordmark b span { color: var(--star-text); }
.wordmark small { font: 500 .62rem var(--f-mono); letter-spacing: .14em; color: var(--ink-3); margin-top: 3px; }
.pill-profile { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2); color: var(--ink); cursor: pointer; text-align: left; margin-bottom: 8px; transition: transform .16s var(--ease-out), border-color .16s; }
.pill-profile:hover { border-color: var(--line-2); }
.pill-profile .t { display: flex; flex-direction: column; min-width: 0; }
.pill-profile .t b { font-size: .875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-profile .t span { font-size: .75rem; color: var(--ink-2); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; transition: transform .16s var(--ease-out), background-color .16s, color .16s; }
.nav a:hover { background: var(--s2); color: var(--ink); }
.nav a[aria-current="page"] { background: color-mix(in oklab, var(--accent) 14%, var(--s1)); color: var(--ink); }
.nav a[aria-current="page"] .ic { color: var(--accent); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid var(--line); }
.side-foot .nav a, .side-foot button.navlike { width: 100%; }
button.navlike { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; color: var(--ink-2); background: transparent; border: 0; cursor: pointer; font-weight: 500; text-align: left; transition: transform .16s var(--ease-out), background-color .16s; }
button.navlike:hover { background: var(--s2); color: var(--ink); }
.avatar { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 .75rem var(--f-mono); flex: none; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 12px; z-index: 30; margin: 12px 16px 0; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 8px; border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--line); box-shadow: var(--shadow); }
.stat { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 999px; font: 600 .82rem var(--f-mono); }
.stat.gold { background: var(--star); color: var(--star-ink); }
.searchbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 8px 0 12px; margin: 0 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--s1); color: var(--ink-2); cursor: pointer; min-width: 220px; transition: transform .16s var(--ease-out), border-color .16s; }
.searchbtn:hover { border-color: var(--line-2); }
.searchbtn span { flex: 1; text-align: left; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line); }
.seg button { min-width: 36px; min-height: 30px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font: 600 .75rem var(--f-mono); cursor: pointer; transition: background-color .16s, color .16s; }
.seg button[aria-pressed="true"] { background: var(--s1); color: var(--ink); box-shadow: var(--shadow); }
.switch { position: relative; display: inline-flex; align-items: center; justify-content: space-between; width: 64px; height: 34px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--s2); color: var(--ink-3); cursor: pointer; }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 999px; background: var(--s1); box-shadow: var(--shadow); transition: transform .32s var(--ease-in-out); }
.switch[aria-checked="true"] .knob { transform: translateX(30px); }
.switch .ic { width: 16px; height: 16px; position: relative; z-index: 1; }

.content { width: 100%; max-width: 1180px; margin: 0 auto; padding: 32px 28px 64px; }
.view { display: flex; flex-direction: column; gap: 24px; }
@media (prefers-reduced-motion: no-preference) {
  .view { transition: opacity .2s var(--ease-out), transform .2s var(--ease-out); }
  @starting-style { .view { opacity: 0; transform: translateY(6px); } }
  .stagger > * { animation: rise .32s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.vhead { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.vhead .lede { color: var(--ink-2); max-width: 64ch; margin-top: 8px; font-size: 1rem; }

/* ============ Tarjetas ============ */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.link { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); cursor: pointer; text-align: left; transition: transform .16s var(--ease-out), border-color .16s; }
.card.link:hover { border-color: var(--line-2); }
.card h2 { margin-bottom: 6px; }
.card .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--ink-2); font-size: .82rem; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi b { font: 650 2rem/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--ink-2); font-size: .875rem; }
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--s2); border: 1px solid var(--line); color: var(--ink); }
.callout .ic { color: var(--accent); margin-top: 2px; }
.callout.warn .ic { color: var(--warn); }
.callout.crit { border-color: color-mix(in oklab, var(--crit) 40%, var(--line)); }
.callout.crit .ic { color: var(--crit); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 28px; border-radius: var(--r); border: 1px dashed var(--line-2); background: var(--s1); }

/* ============ Etiquetas de estado ============ */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; border: 1px solid var(--line-2); background: var(--s2); color: var(--ink-2); }
.chip .ic { width: 14px; height: 14px; }
.chip.st-borrador { color: var(--ink-3); background: var(--s2); }
:root .chip.st-borrador { color: var(--ink-2); }
.chip.st-lista { color: var(--on-accent); background: var(--accent); border-color: transparent; }
.chip.st-brillante, .chip.gold { color: var(--star-ink); background: var(--star); border-color: transparent; }
.chip.ensayo { color: var(--ink); background: transparent; border-style: dashed; }
.score { display: inline-flex; align-items: baseline; gap: 2px; font: 650 1rem var(--f-mono); font-variant-numeric: tabular-nums; }
.score small { font-size: .7rem; color: var(--ink-3); font-weight: 500; }

/* ============ Formularios ============ */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .label { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: 8px; }
.field .hint { color: var(--ink-2); font-size: .82rem; }
input[type="text"], input[type="search"], textarea, select { width: 100%; min-height: 42px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--s1); color: var(--ink); transition: border-color .16s, box-shadow .16s; }
textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 28%, transparent); }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.choice { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--s1); cursor: pointer; transition: transform .16s var(--ease-out), border-color .16s, background-color .16s; }
.choice:hover { border-color: var(--ink-3); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice:has(input:checked) { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 9%, var(--s1)); box-shadow: 0 0 0 1px var(--accent) inset; }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice .ic { color: var(--accent); margin-top: 2px; }
.choice b { display: block; font-weight: 600; }
.choice span { color: var(--ink-2); font-size: .84rem; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--s1); cursor: pointer; font-size: .875rem; transition: transform .16s var(--ease-out), border-color .16s, background-color .16s; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.check:has(input:checked) { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, var(--s1)); }
.check:active { transform: scale(.97); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; font-weight: 600; margin-bottom: 8px; }

/* ============ Asistente de perfil ============ */
.wizard { max-width: 860px; margin: 0 auto; }
.steps { display: flex; gap: 8px; list-style: none; padding: 0; margin: 0 0 8px; }
.steps li { display: flex; align-items: center; gap: 8px; font: 500 .78rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.steps li::after { content: ""; width: 28px; height: 1px; background: var(--line-2); }
.steps li:last-child::after { display: none; }
.steps li[aria-current="step"] { color: var(--accent); }
.steps li.done { color: var(--ink-2); }
.hero-mark { width: 72px; height: 72px; }

/* ============ Forja ============ */
.forge { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.forge .panel { position: sticky; top: 88px; }
.block { display: flex; gap: 12px; }
.block .letter { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--s2); border: 1px solid var(--line); font: 650 1rem var(--f-display); color: var(--accent); margin-top: 26px; }
.block .field { flex: 1; }
.wc { font: 500 .75rem var(--f-mono); color: var(--ink-2); }
.bar { height: 8px; border-radius: 999px; background: var(--s3); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .32s var(--ease-out); }
.bar.gold > i { background: var(--star); }
.crit-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: .84rem; }
.crit-row .bar { grid-column: 1 / -1; height: 6px; }
.tips { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tips li { display: flex; gap: 10px; align-items: flex-start; font-size: .875rem; padding: 10px 12px; border-radius: 12px; background: var(--s2); }
.tips li .ic { width: 16px; height: 16px; margin-top: 3px; color: var(--accent); }
.tips li.crit .ic { color: var(--crit); }
.dist { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--s3); gap: 2px; }
.dist i { display: block; height: 100%; background: var(--accent); transition: flex-grow .32s var(--ease-out); }
.dist i:nth-child(2) { background: color-mix(in oklab, var(--accent) 70%, var(--s1)); }
.dist i:nth-child(3) { background: var(--ink-2); }
.dist i:nth-child(4) { background: var(--star); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font: 500 .75rem var(--f-mono); color: var(--ink-2); }
.story-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

/* ============ Diálogos ============ */
dialog { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--s1); color: var(--ink); padding: 0; box-shadow: var(--shadow-lg); width: min(720px, calc(100vw - 24px)); max-height: min(86dvh, 820px); }
dialog::backdrop { background: rgba(8,9,11,.48); }
@media (prefers-reduced-motion: no-preference) {
  dialog[open] { animation: pop .22s var(--ease-out); }
  dialog[open]::backdrop { animation: fade .22s var(--ease-out); }
}
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes fade { from { opacity: 0; } }
.dlg { display: flex; flex-direction: column; max-height: inherit; }
.dlg-h { display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px 20px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { flex: 1; }
.dlg-b { padding: 20px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { flex: none; min-height: 40px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--ink-2); font-weight: 550; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: transform .16s var(--ease-out), color .16s; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.prose { display: flex; flex-direction: column; gap: 12px; }
.prose h3 { margin-top: 8px; }
.prose li { margin: 4px 0; }
table { width: 100%; border-collapse: collapse; font-size: .875rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); }
dl.gloss { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 8px 16px; margin: 0; }
dl.gloss dt { font-weight: 600; }
dl.gloss dd { margin: 0; color: var(--ink-2); }

/* Búsqueda */
.search-dlg { width: min(640px, calc(100vw - 24px)); }
.search-in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.search-in input { border: 0; min-height: 40px; padding: 0; background: transparent; box-shadow: none !important; font-size: 1rem; }
.results { list-style: none; margin: 0; padding: 8px; max-height: 60dvh; overflow: auto; }
.results li a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; }
.results li a[aria-selected="true"], .results li a:hover { background: var(--s2); }
.results li a .k { margin-left: auto; font: 500 .7rem var(--f-mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }

/* Acentos */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; border: 2px solid var(--line); background: var(--s1); cursor: pointer; transition: transform .16s var(--ease-out), border-color .16s; }
.swatch i { width: 20px; height: 20px; border-radius: 999px; display: block; }
.swatch[aria-checked="true"] { border-color: var(--ink); }
.sw-azul i { background: #1a4fe0; } .sw-rosa i { background: #b8155a; } .sw-solar i { background: #8a4a00; } .sw-glaciar i { background: #0a6a7d; }
.sw-orquidea i { background: #5b35f0; } .sw-verde i { background: #1a6b36; } .sw-rojo i { background: #b3141a; }
:root[data-theme="dark"] .sw-azul i { background: #6b9bff; } :root[data-theme="dark"] .sw-rosa i { background: #ff7ab8; } :root[data-theme="dark"] .sw-solar i { background: #ffb020; } :root[data-theme="dark"] .sw-glaciar i { background: #5ee7f5; }
:root[data-theme="dark"] .sw-orquidea i { background: #b79bff; } :root[data-theme="dark"] .sw-verde i { background: #5aa86a; } :root[data-theme="dark"] .sw-rojo i { background: #ff6b6b; }
.popover { position: fixed; z-index: 60; padding: 14px; border-radius: var(--r); background: var(--s1); border: 1px solid var(--line); box-shadow: var(--shadow-lg); transform-origin: var(--origin, bottom left); }
@media (prefers-reduced-motion: no-preference) { .popover:not([hidden]) { animation: popo .18s var(--ease-out); } }
@keyframes popo { from { opacity: 0; transform: scale(.96); } }
.popover h3 { font-size: .8rem; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); margin-bottom: 10px; }

/* Avisos */

.foot { margin-top: auto; padding: 24px 28px 32px; color: var(--ink-2); font-size: .8rem; text-align: center; }
.foot p + p { margin-top: 4px; }

/* ============ Móvil ============ */
.bnav, .mobile-only { display: none; }
@media (max-width: 767px) {
  .app, .app.collapsed { grid-template-columns: 1fr; }
  .side { display: none; }
  .desk-only { display: none !important; }
  .mobile-only { display: inline-flex; }
  .topbar { margin: 8px 8px 0; top: 8px; min-height: 52px; padding: 0 6px; gap: 2px; }
  .searchbtn { min-width: 0; padding: 0 10px; }
  .searchbtn kbd { display: none; }
  .searchbtn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .content { padding: 20px 16px 120px; }
  .forge { grid-template-columns: 1fr; }
  .forge .panel { position: static; }
  .bnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 40; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding: 6px; border-radius: 22px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }

/* ============ Constelación ============ */
.sky-card { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.sky-wrap { position: relative; border-radius: var(--r); background: var(--canvas); overflow: hidden; }
.sky { display: block; width: 100%; height: auto; }
.sky .zone-label { font: 600 15px var(--f); fill: var(--canvas-ink); }
.sky .zone-meta { font: 500 11px var(--f-mono); fill: var(--canvas-ink); opacity: .78; letter-spacing: .04em; }
.sky .zone.empty .zone-label { opacity: .9; }
.sky .ghost-line { fill: none; stroke: var(--canvas-ink); stroke-opacity: .5; stroke-width: 1.5; stroke-dasharray: 4 6; }
.sky .ghost-star { fill: none; stroke: var(--canvas-ink); stroke-opacity: .55; stroke-width: 1.2; stroke-dasharray: 3 3; }
.sky .const-line { fill: none; stroke: var(--canvas-ink); stroke-opacity: .5; stroke-width: 1.5; stroke-dasharray: 1200; stroke-dashoffset: 0; }
.sky .star .hit { fill: transparent; }
.sky .star .core { fill: var(--canvas-ink); transform-box: fill-box; transform-origin: center; transition: transform .2s var(--ease-out); }
.sky .star.st-borrador .core { fill: var(--canvas-ink); opacity: .55; }
.sky .star.st-lista .core { fill: var(--accent); }
.sky .star.st-brillante .core { fill: var(--star); stroke: var(--star-ink); stroke-opacity: .55; stroke-width: 1; }
.sky .star .glow { fill: var(--star); opacity: .22; }
.sky .star:hover .core, .sky .star:focus-visible .core { transform: scale(1.25); }
.sky .star:focus { outline: none; }
.sky .star:focus-visible .hit { stroke: var(--canvas-ink); stroke-width: 2; }
@media (prefers-reduced-motion: no-preference) {
  .sky .star.nueva .core { animation: flash .3s var(--ease-out); }
  .sky .const-line.draw { animation: draw .6s var(--ease-out) both; }
}
@media (prefers-reduced-motion: reduce) { .sky .star.nueva { animation: fade .3s linear; } }
@keyframes flash { from { transform: scale(2.2); opacity: 0; } }
@keyframes draw { from { stroke-dashoffset: 1200; } }
.star-tip { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 6px; max-width: 260px; padding: 10px 12px; border-radius: 12px; background: var(--s1); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-lg); pointer-events: none; }
.table-wrap { overflow-x: auto; }

.qlist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }

.qlist details summary { cursor: pointer; color: var(--accent); font-size: .875rem; font-weight: 550; min-height: 24px; }
#banco select { width: auto; min-width: 220px; }

// ---- src/engine/constants.js ----
// Constantes del analizador STAR, de la puntuación y del juego.
// La ayuda «Método STAR» se genera a partir de este archivo: no escribas cifras a mano en otro sitio.


/** Reparto ideal de palabras por bloque (porcentaje mínimo y máximo). */
const REPARTO = {
  s: { min: 15, max: 20 },
  t: { min: 10, max: 15 },
  a: { min: 50, max: 60 },
  r: { min: 15, max: 20 },
};
/** Margen de tolerancia, en puntos porcentuales, antes de dar un bloque por desequilibrado. */
const REPARTO_TOLERANCIA = 7;

/** Longitud de la respuesta hablada. */
const DURACION = { minPalabras: 150, maxPalabras: 350, palabrasPorMinuto: 140 };

/** Porcentaje mínimo de verbos en primera persona del singular dentro de la acción. */
const YO_MINIMO = 60;

/** Verbos de acción distintos que se esperan en el bloque Acción. */
const VERBOS_MINIMOS = 3;

/** Muletillas toleradas antes de restar. */
const MULETILLAS_TOLERADAS = 1;

/** Peso de cada criterio en la nota final (suman 100). */
const PESOS = {
  reparto: 25,
  duracion: 10,
  yo: 20,
  cifra: 20,
  verbos: 10,
  muletillas: 10,
  aprendizaje: 5,
};

/** Penalización por cada dato sensible detectado y tope. */
const SENSIBLE = { penalizacion: 10, tope: 20 };

/** Umbrales de estado por nivel del perfil. */
const UMBRALES = {
  'sin-experiencia': { lista: 55, brillante: 82 },
  junior: { lista: 60, brillante: 85 },
  mid: { lista: 65, brillante: 88 },
  senior: { lista: 70, brillante: 90 },
};

/** Estados de una historia. */
const ESTADOS = ['borrador', 'lista', 'brillante'];

/** Límites de saneado al importar o cargar datos. */
const LIMITES = {
  titulo: 120,
  bloque: 4000,
  historias: 300,
  duelos: 2000,
  competenciasPorHistoria: 6,
  insignias: 100,
  nombre: 60,
  sensibles: 30,
  sensible: 60,
  diasHistorial: 1000,
};

/** Valores admitidos en el perfil. */
const ROLES = ['red', 'blue', 'grc', 'data'];
const NIVELES = ['sin-experiencia', 'junior', 'mid', 'senior'];
const EMPRESAS = ['consultora', 'banca', 'tecnologica', 'startup', 'publica', 'industria'];
const IDIOMAS = ['es', 'en'];
const TIPOS = ['real', 'ensayo'];

// ---- src/engine/analyzer.js ----
// Analizador STAR: reglas explicables, deterministas y sin DOM.

const BLOQUES = ['s', 't', 'a', 'r'];

function lexicon(idioma) {
  return idioma === 'en' ? LEX_EN : LEX_ES;
}

/** Normaliza a minúsculas y quita signos, conservando tildes (las necesitan los verbos). */
function normalize(text) {
  return String(text || '').toLowerCase().replace(/[\u2019]/g, "'");
}

/** Quita tildes: para búsquedas insensibles a acentos. */
function fold(text) {
  return String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function tokens(text) {
  return normalize(text).match(/[\p{L}\p{N}][\p{L}\p{N}'%.,-]*[\p{L}\p{N}%]|[\p{L}\p{N}]/gu) || [];
}

function wordCount(text) {
  return tokens(text).length;
}

function escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

/** Cuenta apariciones de una expresión como palabra completa. */
function countPhrase(text, phrase) {
  const re = new RegExp(`(^|[^\\p{L}\\p{N}'])${escapeRe(phrase)}(?=$|[^\\p{L}\\p{N}'])`, 'gu');
  return (normalize(text).match(re) || []).length;
}

function countList(text, list) {
  const found = [];
  let total = 0;
  for (const p of list) {
    const n = countPhrase(text, p);
    if (n) { total += n; found.push({ term: p, n }); }
  }
  return { total, found };
}

/** Reparto de palabras entre S, T, A y R. */
function distribution(story) {
  const counts = {};
  let total = 0;
  for (const b of BLOQUES) { counts[b] = wordCount(story[b]); total += counts[b]; }
  const pct = {};
  for (const b of BLOQUES) pct[b] = total ? Math.round((counts[b] / total) * 100) : 0;
  const issues = [];
  if (total) {
    for (const b of BLOQUES) {
      const { min, max } = REPARTO[b];
      if (pct[b] < min - REPARTO_TOLERANCIA) issues.push({ bloque: b, tipo: 'poco', pct: pct[b], min, max });
      else if (pct[b] > max + REPARTO_TOLERANCIA) issues.push({ bloque: b, tipo: 'mucho', pct: pct[b], min, max });
    }
  }
  return { counts, pct, total, issues };
}

function duration(story) {
  const words = BLOQUES.reduce((n, b) => n + wordCount(story[b]), 0) + wordCount(story.l);
  const seconds = Math.round((words / DURACION.palabrasPorMinuto) * 60);
  let estado = 'ok';
  if (words < DURACION.minPalabras) estado = 'corta';
  else if (words > DURACION.maxPalabras) estado = 'larga';
  return { words, seconds, estado };
}

/** Verbos en primera persona del singular frente a plural, dentro de la acción. */
function firstPerson(text, idioma = 'es') {
  const lex = lexicon(idioma);
  const plural = countList(text, lex.plural);
  let singular = countList(text, lex.singular).total;
  if (idioma === 'en') {
    singular = countList(text, ['i']).total + countList(text, ['myself']).total;
  } else {
    const nov = new Set(lex.noVerbos);
    const sing = new Set(lex.singular);
    for (const w of tokens(text)) {
      if (w.length > 2 && /[éí]$/.test(w) && !nov.has(w) && !sing.has(w)) singular++;
    }
  }
  const total = singular + plural.total;
  const pct = total ? Math.round((singular / total) * 100) : 100;
  return { singular, plural: plural.total, pluralFound: plural.found, pct, ok: total === 0 ? false : pct >= YO_MINIMO, vacio: total === 0 };
}

const NUM_RE = /\d|%/;

/** ¿El resultado tiene una cifra, un porcentaje, un tiempo o un antes y después? */
function measurable(text, idioma = 'es') {
  const lex = lexicon(idioma);
  const digits = NUM_RE.test(String(text || ''));
  const palabras = countList(text, lex.cifrasPalabras);
  const antesDespues = idioma === 'en'
    ? /\bfrom\b[^.]{1,40}\bto\b/i.test(text || '')
    : /\bde\b[^.]{1,40}\ba\b[^.]{0,20}\d/i.test(text || '') || (countPhrase(text, 'antes') > 0 && countPhrase(text, 'después') > 0);
  return { ok: digits || antesDespues || palabras.total >= 2, digits, antesDespues };
}

function actionVerbs(text, idioma = 'es') {
  const lex = lexicon(idioma);
  const { found } = countList(text, lex.verbosAccion);
  const sentences = String(text || '').split(/[.!?\n]+/).map(s => normalize(s).trim()).filter(Boolean);
  const weak = [];
  for (const s of sentences) {
    for (const w of lex.arranquesDebiles) {
      if (s === w || s.startsWith(w + ' ')) { weak.push(w); break; }
    }
  }
  return { distinct: found.length, verbs: found.map(f => f.term), weak, ok: found.length >= VERBOS_MINIMOS && weak.length < 3 };
}

function fillers(story, idioma = 'es') {
  const lex = lexicon(idioma);
  const text = [...BLOQUES, 'l'].map(b => story[b] || '').join('\n');
  const { total, found } = countList(text, lex.muletillas);
  return { total, found, ok: total <= MULETILLAS_TOLERADAS };
}

function learning(story, idioma = 'es') {
  const lex = lexicon(idioma);
  const hasL = wordCount(story.l) >= 4;
  const inR = countList(story.r, lex.aprendizaje).total > 0;
  return { ok: hasL || inR };
}

const IPV4 = /\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b/g;
const EMAIL = /\b[\w.+-]+@[\w-]+(?:\.[\w-]+)+\b/g;
const INTERNO = /\b[\w-]+(?:\.[\w-]+)*\.(?:local|corp|internal|intranet|lan|ad|int)\b/gi;
const CVE = /\bCVE-\d{4}-\d{4,7}\b/gi;
const DOC_IPS = [/^192\.0\.2\./, /^198\.51\.100\./, /^203\.0\.113\./, /^0\.0\.0\.0$/, /^127\./];

/**
 * Datos sensibles: IP, correos, dominios internos, CVE (pueden señalar un cliente sin parchear)
 * y términos que la persona marca como confidenciales.
 */
function sensitive(story, marcados = []) {
  const text = [...BLOQUES, 'l', 'titulo'].map(b => story[b] || '').join('\n');
  const hits = [];
  for (const m of text.match(IPV4) || []) if (!DOC_IPS.some(re => re.test(m))) hits.push({ tipo: 'ip', valor: m });
  for (const m of text.match(EMAIL) || []) hits.push({ tipo: 'email', valor: m });
  const emails = new Set((text.match(EMAIL) || []).map(e => e.split('@')[1].toLowerCase()));
  for (const m of text.match(INTERNO) || []) if (!emails.has(m.toLowerCase())) hits.push({ tipo: 'dominio', valor: m });
  for (const m of text.match(CVE) || []) hits.push({ tipo: 'cve', valor: m.toUpperCase() });
  for (const term of marcados) {
    const t = String(term || '').trim();
    if (t.length >= 2 && countPhrase(text, t.toLowerCase()) > 0) hits.push({ tipo: 'cliente', valor: t });
  }
  const seen = new Set();
  return hits.filter(h => { const k = h.tipo + ':' + h.valor.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
}

/** Análisis completo de una historia. */
function analyze(story, { idioma = 'es', marcados = [] } = {}) {
  return {
    reparto: distribution(story),
    duracion: duration(story),
    yo: firstPerson(story.a, idioma),
    cifra: measurable(story.r, idioma),
    verbos: actionVerbs(story.a, idioma),
    muletillas: fillers(story, idioma),
    aprendizaje: learning(story, idioma),
    sensibles: sensitive(story, marcados),
  };
}

// ---- src/engine/score.js ----
// Puntuación 0–100 con desglose por criterio y sugerencias explicadas.

function clamp(n, lo = 0, hi = 1) { return Math.max(lo, Math.min(hi, n)); }

function isEmpty(story) {
  return BLOQUES.every(b => !String(story[b] || '').trim());
}

/**
 * Devuelve { total, estado, criterios: [{id, puntos, max, ok}], consejos: [{id, clave, params}], analisis }.
 * Las claves de los consejos se traducen en la interfaz (i18n: tip.*).
 */
function scoreStory(story, { idioma = 'es', nivel = 'junior', marcados = [] } = {}) {
  const an = analyze(story, { idioma, marcados });
  const criterios = [];
  const consejos = [];
  const add = (id, frac, extra = {}) => {
    const max = PESOS[id];
    criterios.push({ id, max, puntos: Math.round(max * clamp(frac)), ok: frac >= 0.999, ...extra });
  };

  if (isEmpty(story)) {
    for (const id of Object.keys(PESOS)) criterios.push({ id, max: PESOS[id], puntos: 0, ok: false });
    return { total: 0, estado: 'borrador', criterios, consejos: [{ id: 'vacia', clave: 'tip.vacia', params: {} }], analisis: an };
  }

  // Reparto: cada bloque vacío o desequilibrado resta su parte.
  const r = an.reparto;
  let repFrac = 1;
  for (const b of BLOQUES) {
    if (!r.counts[b]) { repFrac -= 0.25; consejos.push({ id: 'falta-' + b, clave: 'tip.falta', params: { bloque: b } }); }
  }
  for (const is of r.issues) {
    if (!r.counts[is.bloque]) continue;
    repFrac -= 0.15;
    consejos.push({ id: 'reparto-' + is.bloque, clave: is.tipo === 'mucho' ? 'tip.repartoMucho' : 'tip.repartoPoco', params: { bloque: is.bloque, pct: is.pct, min: is.min, max: is.max } });
  }
  add('reparto', repFrac);

  // Duración.
  const d = an.duracion;
  if (d.estado === 'ok') add('duracion', 1);
  else if (d.estado === 'corta') {
    add('duracion', d.words / DURACION.minPalabras);
    consejos.push({ id: 'corta', clave: 'tip.corta', params: { palabras: d.words, segundos: d.seconds, min: DURACION.minPalabras } });
  } else {
    add('duracion', 1 - (d.words - DURACION.maxPalabras) / DURACION.maxPalabras);
    consejos.push({ id: 'larga', clave: 'tip.larga', params: { palabras: d.words, segundos: d.seconds, max: DURACION.maxPalabras } });
  }

  // Yo frente a nosotros.
  const y = an.yo;
  if (y.vacio) {
    add('yo', 0);
    consejos.push({ id: 'yo-vacio', clave: 'tip.yoVacio', params: {} });
  } else if (y.ok) add('yo', 1);
  else {
    add('yo', y.pct / 100);
    const top = y.pluralFound.slice().sort((a, b) => b.n - a.n)[0];
    consejos.push({ id: 'nosotros', clave: 'tip.nosotros', params: { termino: top ? top.term : '', veces: y.plural, pct: y.pct } });
  }

  // Resultado medible.
  if (an.cifra.ok) add('cifra', 1);
  else { add('cifra', 0); consejos.push({ id: 'cifra', clave: 'tip.cifra', params: {} }); }

  // Verbos de acción.
  const v = an.verbos;
  add('verbos', Math.min(1, v.distinct / 3) - (v.weak.length >= 3 ? 0.4 : 0));
  if (v.weak.length >= 2) consejos.push({ id: 'arranques', clave: 'tip.arranques', params: { termino: v.weak[0], veces: v.weak.length } });
  else if (v.distinct < 3) consejos.push({ id: 'verbos', clave: 'tip.verbos', params: { n: v.distinct } });

  // Muletillas.
  const m = an.muletillas;
  add('muletillas', m.ok ? 1 : 1 - (m.total - MULETILLAS_TOLERADAS) * 0.25);
  if (m.total) {
    const top = m.found.slice().sort((a, b) => b.n - a.n)[0];
    consejos.push({ id: 'muletilla', clave: top.term === 'intenté' || top.term === 'i tried' ? 'tip.intente' : 'tip.muletilla', params: { termino: top.term, veces: m.total } });
  }

  // Aprendizaje.
  if (an.aprendizaje.ok) add('aprendizaje', 1);
  else { add('aprendizaje', 0); consejos.push({ id: 'aprendizaje', clave: 'tip.aprendizaje', params: {} }); }

  // Una historia muy corta no puede puntuar alto por lo que no tiene: los criterios de estilo
  // se escalan según lo completa que esté (a partir de la longitud mínima cuentan enteros).
  const completitud = Math.min(1, 0.3 + 0.7 * (d.words / DURACION.minPalabras));
  if (completitud < 1) for (const c of criterios) if (c.id !== 'duracion') c.puntos = Math.round(c.puntos * completitud);
  let total = criterios.reduce((n, c) => n + c.puntos, 0);
  const sens = an.sensibles;
  if (sens.length) {
    total -= Math.min(SENSIBLE.tope, sens.length * SENSIBLE.penalizacion);
    for (const h of sens) consejos.unshift({ id: 'sensible-' + h.tipo + '-' + h.valor, clave: 'tip.sensible.' + h.tipo, params: { valor: h.valor } });
  }
  total = Math.max(0, Math.min(100, Math.round(total)));
  const u = UMBRALES[nivel] || UMBRALES.junior;
  let estado = total >= u.brillante ? 'brillante' : total >= u.lista ? 'lista' : 'borrador';
  if (sens.length && estado !== 'borrador') estado = 'borrador';
  if (nivel === 'senior' && !an.cifra.ok && estado === 'brillante') estado = 'lista';
  return { total, estado, criterios, consejos, analisis: an };
}

// ---- src/engine/sanitize.js ----
// Carga segura de datos: safeParse descarta claves peligrosas y sanitize reconstruye campo a campo.

const PELIGROSAS = new Set(['__proto__', 'constructor', 'prototype']);

function safeParse(text) {
  try {
    return JSON.parse(String(text), (k, v) => (PELIGROSAS.has(k) ? undefined : v));
  } catch {
    return null;
  }
}

function str(v, max) {
  return typeof v === 'string' ? v.slice(0, max) : '';
}
function oneOf(v, list, def) {
  return list.includes(v) ? v : def;
}
function int(v, lo, hi, def = 0) {
  const n = Number(v);
  return Number.isFinite(n) ? Math.max(lo, Math.min(hi, Math.round(n))) : def;
}
const FECHA = /^\d{4}-\d{2}-\d{2}$/;
function date(v) {
  return typeof v === 'string' && FECHA.test(v) ? v : '';
}
const ID = /^[a-z0-9_-]{1,40}$/i;

function emptyState() {
  return {
    version: 1,
    perfil: null,
    historias: [],
    duelos: [],
    xp: 0,
    racha: 0,
    ultimoDia: '',
    insignias: [],
    historialXp: {},
    ajustes: { sensibles: [] },
  };
}

function sanitizeStory(h, competenciasValidas) {
  if (!h || typeof h !== 'object') return null;
  const id = typeof h.id === 'string' && ID.test(h.id) && !PELIGROSAS.has(h.id) ? h.id : null;
  if (!id) return null;
  const comps = Array.isArray(h.competencias) ? h.competencias.filter(c => typeof c === 'string' && (!competenciasValidas || competenciasValidas.includes(c))) : [];
  return {
    id,
    titulo: str(h.titulo, LIMITES.titulo),
    tipo: oneOf(h.tipo, TIPOS, 'real'),
    s: str(h.s, LIMITES.bloque),
    t: str(h.t, LIMITES.bloque),
    a: str(h.a, LIMITES.bloque),
    r: str(h.r, LIMITES.bloque),
    l: str(h.l, LIMITES.bloque),
    competencias: [...new Set(comps)].slice(0, LIMITES.competenciasPorHistoria),
    creada: date(h.creada),
    editada: date(h.editada),
  };
}

function sanitizePerfil(p) {
  if (!p || typeof p !== 'object') return null;
  if (!ROLES.includes(p.rol)) return null;
  return {
    nombre: str(p.nombre, LIMITES.nombre),
    rol: p.rol,
    nivel: oneOf(p.nivel, NIVELES, 'junior'),
    empresa: oneOf(p.empresa, EMPRESAS, 'consultora'),
    idioma: oneOf(p.idioma, IDIOMAS, 'es'),
  };
}

function sanitizeState(raw, { competencias } = {}) {
  const out = emptyState();
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  out.perfil = sanitizePerfil(raw.perfil);
  const ids = new Set();
  if (Array.isArray(raw.historias)) {
    for (const h of raw.historias.slice(0, LIMITES.historias)) {
      const s = sanitizeStory(h, competencias);
      if (s && !ids.has(s.id)) { ids.add(s.id); out.historias.push(s); }
    }
  }
  if (Array.isArray(raw.duelos)) {
    for (const d of raw.duelos.slice(-LIMITES.duelos)) {
      if (!d || typeof d !== 'object') continue;
      out.duelos.push({
        fecha: date(d.fecha),
        recruiter: str(d.recruiter, 40),
        ruta: oneOf(d.ruta, ROLES, 'red'),
        conviccion: int(d.conviccion, 0, 100),
        superado: d.superado === true,
        modo: str(d.modo, 20),
      });
    }
  }
  out.xp = int(raw.xp, 0, 10_000_000);
  out.racha = int(raw.racha, 0, 100_000);
  out.ultimoDia = date(raw.ultimoDia);
  out.insignias = Array.isArray(raw.insignias) ? [...new Set(raw.insignias.filter(i => typeof i === 'string' && ID.test(i)))].slice(0, LIMITES.insignias) : [];
  if (raw.historialXp && typeof raw.historialXp === 'object' && !Array.isArray(raw.historialXp)) {
    const keys = Object.keys(raw.historialXp).filter(k => FECHA.test(k)).sort().slice(-LIMITES.diasHistorial);
    for (const k of keys) out.historialXp[k] = int(raw.historialXp[k], 0, 1_000_000);
  }
  if (raw.ajustes && typeof raw.ajustes === 'object' && Array.isArray(raw.ajustes.sensibles)) {
    out.ajustes.sensibles = raw.ajustes.sensibles.filter(s => typeof s === 'string').map(s => s.slice(0, LIMITES.sensible)).slice(0, LIMITES.sensibles);
  }
  return out;
}

}

// ---------- DOM ----------
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

/** Crea un elemento. Los hijos de texto se insertan como nodos de texto, nunca como HTML. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  append(el, kids);
  return el;
}
function append(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}

const SVGNS = 'http://www.w3.org/2000/svg';
const ICON_TEMPLATES = new Map();
/** Icono Lucide (marcado de confianza incrustado en el build, nunca datos del usuario). */
function icon(name, cls = 'ic') {
  let tpl = ICON_TEMPLATES.get(name);
  if (!tpl) {
    tpl = document.createElementNS(SVGNS, 'svg');
    tpl.setAttribute('viewBox', '0 0 24 24');
    tpl.setAttribute('width', '20');
    tpl.setAttribute('height', '20');
    tpl.setAttribute('fill', 'none');
    tpl.setAttribute('stroke', 'currentColor');
    tpl.setAttribute('stroke-width', '1.75');
    tpl.setAttribute('stroke-linecap', 'round');
    tpl.setAttribute('stroke-linejoin', 'round');
    tpl.setAttribute('aria-hidden', 'true');
    tpl.setAttribute('focusable', 'false');
    tpl.innerHTML = ICONS[name] || '';
    ICON_TEMPLATES.set(name, tpl);
  }
  const svg = tpl.cloneNode(true);
  svg.setAttribute('class', cls);
  return svg;
}
function markSvg(cls) {
  const tpl = document.createElement('template');
  tpl.innerHTML = MARK_SVG;
  const svg = tpl.content.firstElementChild;
  if (cls) svg.setAttribute('class', cls);
  svg.setAttribute('aria-hidden', 'true');
  svg.removeAttribute('role');
  svg.removeAttribute('aria-label');

}

function stagger(container) {
  [...container.children].forEach((c, i) => c.style.setProperty('--i', String(Math.min(i, 12))));

// Sonidos sintetizados con Web Audio: sin archivos y sin red. Se silencian desde la barra.
let audioCtx = null;
function soundOn() { return lsGet(KEY.sonido) !== 'off'; }
function setSound(on) { lsSet(KEY.sonido, on ? 'on' : 'off'); }

const SOUNDS = {
  ok: [[660, 0, .09], [880, .08, .12]],
  fail: [[300, 0, .12], [220, .1, .18]],
  star: [[784, 0, .08], [1047, .07, .08], [1319, .14, .16]],
  rank: [[523, 0, .1], [659, .1, .1], [784, .2, .1], [1047, .3, .26]],
  tick: [[1200, 0, .03]],
};
function playSound(name) {
  if (!soundOn() || !SOUNDS[name]) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    for (const [freq, at, dur] of SOUNDS[name]) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, now + at);
      g.gain.exponentialRampToValueAtTime(0.08, now + at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + at + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(now + at);
      o.stop(now + at + dur + 0.02);
    }
  } catch { /* sin audio */ }
}

const EXTRA_ROUTES = ['perfil', 'privacidad'];
const VIEWS = {};

function parseHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  const [id, ...rest] = raw.split('/');
  const known = ROUTES.some(r => r.id === id) || EXTRA_ROUTES.includes(id);
  return { id: known ? id : 'inicio', arg: rest.join('/') };

  const fn = VIEWS[viewId] || VIEWS.inicio;

// ---------- Popovers del lateral ----------
let openPop = null;
function togglePop(pop, btn, build) {
  if (openPop && openPop.pop === pop) { closePop(); return; }
  closePop();
  pop.replaceChildren(...build());
  pop.hidden = false;
  const r = btn.getBoundingClientRect();
  pop.style.left = Math.round(r.left) + 'px';
  pop.style.bottom = Math.round(innerHeight - r.top + 8) + 'px';
  pop.style.setProperty('--origin', 'bottom left');
  btn.setAttribute('aria-expanded', 'true');
  openPop = { pop, btn };
  const first = pop.querySelector('[aria-checked="true"], button, a');
  if (first) first.focus();
}
function closePop(returnFocus = false) {
  if (!openPop) return;
  openPop.pop.hidden = true;
  openPop.btn.setAttribute('aria-expanded', 'false');
  if (returnFocus) openPop.btn.focus();
  openPop = null;
}

function exportData() {
  const env = { formato: 'yrd-ecosistema', version: 1, tipo: 'historias', app: 'astrolabio', appVersion: APP_VERSION, exportado: new Date().toISOString(), datos: UI.state };
  download(`astrolabio-${today()}.json`, JSON.stringify(env, null, 2));
  toast(t('toast.exportado'), { ic: 'download' });
}
async function importData(file) {
  if (!file) return;
  if (file.size > 5_000_000) { toast(t('toast.importGrande'), { ic: 'triangle-alert' }); return; }
  const text = await file.text();
  const raw = safeParse(text);
  if (!raw || typeof raw !== 'object') { toast(t('toast.importError'), { ic: 'triangle-alert' }); return; }
  const data = raw.formato === 'yrd-ecosistema' ? (raw.tipo === 'historias' ? raw.datos : null) : raw;
  if (!data) { toast(t('toast.importTipo'), { ic: 'triangle-alert' }); return; }
  const clean = sanitizeState(data, { competencias: COMPETENCIA_IDS });
  const ok = await confirmDialog({ title: t('import.titulo'), body: t('import.cuerpo', { n: clean.historias.length }), ok: t('import.ok') });
  if (!ok) return;
  UI.state = clean;
  saveState();
  toast(t('toast.importado', { n: clean.historias.length }), { ic: 'upload' });
  go('inicio');
}
async function wipeAll() {
  const ok = await confirmDialog({ title: t('borrar.titulo'), body: t('borrar.cuerpo'), ok: t('borrar.ok'), danger: true });
  if (!ok) return;
  UI.state = emptyState();
  lsDel(KEY.estado);
  toast(t('toast.borrado'), { ic: 'trash-2' });
  go('inicio');
}

function initShell() {
  wireDialog($('#dlg-help'));
  wireDialog($('#dlg-search'));
  wireDialog($('#dlg-confirm'));
  wireDialog($('#dlg-more'));
  wireDialog($('#dlg-misc'));
  const savedTheme = lsGet(KEY.tema);
  setTheme(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), { animate: false });
  setAccent(lsGet(KEY.acento) || 'azul');
  if (lsGet(KEY.lateral) === 'oculto') $('#app').classList.add('collapsed');
  $('#theme-btn').addEventListener('click', () => { const n = currentTheme() === 'dark' ? 'light' : 'dark'; setTheme(n); lsSet(KEY.tema, n); });
  $$('#lang-seg button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $('#collapse-btn').addEventListener('click', () => {
    const c = $('#app').classList.toggle('collapsed');
    lsSet(KEY.lateral, c ? 'oculto' : 'visible');
    updateCollapseBtn();
  });
  $('#sound-btn').addEventListener('click', () => { setSound(!soundOn()); updateSoundBtn(); if (soundOn()) playSound('ok'); });
  $('#help-btn').addEventListener('click', e => openHelp(undefined, e.currentTarget));
  $('#search-btn').addEventListener('click', e => openSearch(e.currentTarget));
  $('#pill-profile').addEventListener('click', () => go('perfil'));
  $('#accent-btn').addEventListener('click', e => togglePop($('#accent-pop'), e.currentTarget, () => [h('h3', { id: 'accent-h', text: t('ui.acento') }), accentPicker()]));
  $('#account-btn').addEventListener('click', e => togglePop($('#account-pop'), e.currentTarget, accountItems));
  $('#import-file').addEventListener('change', e => { importData(e.target.files[0]); e.target.value = ''; });
  document.addEventListener('click', e => { if (openPop && !openPop.pop.contains(e.target) && !openPop.btn.contains(e.target)) closePop(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && openPop) { e.preventDefault(); closePop(true); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if (typing || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
    if (e.key === '?') { e.preventDefault(); openHelp('atajos'); }
    else if (e.key === 'n' && UI.state.perfil) { e.preventDefault(); go('forja/nueva'); }
    else if (/^[1-6]$/.test(e.key) && UI.state.perfil) { go(ROUTES[Number(e.key) - 1].id); }
  });
  window.addEventListener('hashchange', render);
}

// ---- src/ui/constelacion.js ----
// Constelación: cada competencia es una constelación en una posición fija; cada historia, una estrella.
// Se acompaña siempre de una tabla equivalente.

const STAR_SLOTS = [[0.5, 0.42], [0.24, 0.58], [0.74, 0.62], [0.38, 0.8], [0.64, 0.86], [0.16, 0.86], [0.86, 0.4], [0.3, 0.36]];
const STAR_SIZE = { borrador: 7, lista: 10, brillante: 14 };

function sparklePath(cx, cy, r) {
  const k = r * 0.28;
  return `M${cx} ${cy - r}C${cx + k * 0.4} ${cy - k} ${cx + k} ${cy - k * 0.4} ${cx + r} ${cy}C${cx + k} ${cy + k * 0.4} ${cx + k * 0.4} ${cy + k} ${cx} ${cy + r}C${cx - k * 0.4} ${cy + k} ${cx - k} ${cy + k * 0.4} ${cx - r} ${cy}C${cx - k} ${cy - k * 0.4} ${cx - k * 0.4} ${cy - k} ${cx} ${cy - r}Z`;
}
function svgEl(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, String(v));
  for (const c of kids.flat()) if (c) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

function coverage() {
  const hs = UI.state.historias.map(s => ({ s, sc: scoreOf(s) }));
  return COMPETENCIAS.map(c => {
    const list = hs.filter(x => x.s.competencias.includes(c.id)).sort((a, b) => b.sc.total - a.sc.total);
    return { c, list, best: list.length ? list[0].sc.total : null };
  });
}

VIEWS.constelacion = (view) => {
  const cov = coverage();
  const covered = cov.filter(x => x.list.length).length;
  const missing = cov.filter(x => !x.list.length);
  viewHead(view, { eyebrow: t('nav.constelacion'), title: t('const.titulo'), lede: t('const.lede', { n: covered, total: COMPETENCIAS.length }),
    action: h('a', { class: 'btn primary', href: '#forja/nueva' }, icon('plus'), t('forja.nueva')) });

  const mobile = matchMedia('(max-width: 767px)').matches;
  const cols = mobile ? 2 : 4, rows = Math.ceil(COMPETENCIAS.length / cols);
  const ZW = 300, ZH = mobile ? 250 : 230;
  const W = cols * ZW, H = rows * ZH;
  const summary = missing.length
    ? t('const.aria', { n: covered, total: COMPETENCIAS.length, faltan: missing.map(m => compName(m.c.id)).join(', ') })
    : t('const.ariaCompleta', { total: COMPETENCIAS.length });
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'sky', role: 'group', 'aria-label': summary });
  const tip = h('div', { class: 'star-tip', role: 'tooltip', id: 'star-tip', hidden: true });
  const stars = [];
  const fresh = UI.lastSaved;
  UI.lastSaved = null;

  cov.forEach((zone, i) => {
    const x0 = (i % cols) * ZW, y0 = Math.floor(i / cols) * ZH;
    const g = svgEl('g', { class: 'zone' + (zone.list.length ? '' : ' empty') });
    g.append(svgEl('text', { x: x0 + 20, y: y0 + 34, class: 'zone-label' }, compName(zone.c.id)));
    g.append(svgEl('text', { x: x0 + 20, y: y0 + 54, class: 'zone-meta' }, zone.list.length ? t('const.zoneMeta', { n: zone.list.length, best: zone.best }) : t('const.vacia')));
    const pts = STAR_SLOTS.map(([fx, fy]) => [x0 + 20 + fx * (ZW - 40), y0 + 40 + fy * (ZH - 70)]);
    if (!zone.list.length) {
      const d = pts.slice(0, 4).map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
      g.append(svgEl('path', { d, class: 'ghost-line' }));
      pts.slice(0, 4).forEach(p => g.append(svgEl('path', { d: sparklePath(p[0], p[1], 6), class: 'ghost-star' })));
    } else {
      const used = zone.list.slice(0, STAR_SLOTS.length);
      if (used.length > 1) {
        const d = used.map((_, k) => (k ? 'L' : 'M') + pts[k][0].toFixed(1) + ' ' + pts[k][1].toFixed(1)).join('');
        const line = svgEl('path', { d, class: 'const-line' + (used.some(u => u.s.id === fresh) ? ' draw' : '') });
        g.append(line);
      }
      used.forEach((u, k) => {
        const [cx, cy] = pts[k];
        const r = STAR_SIZE[u.sc.estado];
        const label = t('const.estrella', { titulo: u.s.titulo || t('forja.sinTitulo'), nota: u.sc.total, estado: t('estado.' + u.sc.estado), comp: compName(zone.c.id) });
        const a = svgEl('a', { href: '#forja/' + u.s.id, class: 'star st-' + u.sc.estado + (u.s.id === fresh ? ' nueva' : ''), 'aria-label': label, tabindex: '-1', 'aria-describedby': 'star-tip' },
          svgEl('rect', { x: cx - 16, y: cy - 16, width: 32, height: 32, class: 'hit', rx: 8 }),
          u.sc.estado === 'brillante' ? svgEl('path', { d: sparklePath(cx, cy, r * 1.9), class: 'glow' }) : null,
          svgEl('path', { d: sparklePath(cx, cy, r), class: 'core' }));
        a.dataset.id = u.s.id;
        a.dataset.x = cx / W;
        a.dataset.y = cy / H;
        a._info = { titulo: u.s.titulo || t('forja.sinTitulo'), nota: u.sc.total, estado: u.sc.estado, comps: u.s.competencias };
        g.append(a);
        stars.push(a);
      });
    }
    svg.append(g);
  });
  if (stars.length) stars[0].setAttribute('tabindex', '0');

  const stage = h('div', { class: 'sky-wrap' + (mobile ? ' tall' : '') }, svg, tip);
  const showTip = a => {
    const inf = a._info;
    tip.replaceChildren(h('b', { text: inf.titulo }), h('span', { class: 'row' }, stateChip(inf.estado), h('span', { class: 'score', text: inf.nota + '/100' })), h('span', { class: 'tiny', text: inf.comps.map(compName).join(' · ') }));
    tip.hidden = false;
    const fx = Number(a.dataset.x), fy = Number(a.dataset.y);
    tip.style.left = Math.min(78, Math.max(2, fx * 100 - 10)) + '%';
    tip.style.top = (fy * 100 + 4) + '%';
  };
  const hideTip = () => { tip.hidden = true; };
  stars.forEach((a, i) => {
    a.addEventListener('mouseenter', () => showTip(a));
    a.addEventListener('mouseleave', hideTip);
    a.addEventListener('focus', () => showTip(a));
    a.addEventListener('blur', hideTip);
    a.addEventListener('keydown', e => {
      let n = null;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = (i + 1) % stars.length;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = (i + stars.length - 1) % stars.length;
      if (e.key === 'Home') n = 0;
      if (e.key === 'End') n = stars.length - 1;
      if (e.key === 'Escape') { hideTip(); return; }
      if (n !== null) { e.preventDefault(); a.setAttribute('tabindex', '-1'); stars[n].setAttribute('tabindex', '0'); stars[n].focus(); }
    });
  });

  view.append(h('div', { class: 'card sky-card' }, stage,
    h('p', { class: 'small muted', text: stars.length ? t('const.teclado') : t('const.sinEstrellas') }),
    h('div', { class: 'legend' }, ['borrador', 'lista', 'brillante'].map(e => stateChip(e)))));

  if (missing.length) {
    view.append(h('h2', { text: t('const.faltanTitulo') }), stagger(h('div', { class: 'grid' }, missing.map(m => {
      const q = suggestQuestion(m.c.id);
      return h('div', { class: 'card stack' }, h('div', { class: 'row' }, icon(m.c.icono), h('h3', { text: compName(m.c.id) })),
        h('p', { class: 'muted small', text: t('const.teFalta', { comp: compName(m.c.id).toLowerCase() }) }),
        q ? h('p', { class: 'small' }, h('span', { class: 'faint', text: t('const.prueba') + ' ' }), L(q)) : null,
        h('button', { class: 'btn sm', type: 'button', onclick: () => { renderEditor.prefill = { competencias: [m.c.id], titulo: '' }; go('forja/nueva'); } }, icon('plus', 'ic sm'), t('const.escribir')));
    }))));
  }

  const rows2 = cov.map(z => h('tr', null,
    h('th', { scope: 'row' }, compName(z.c.id)),
    h('td', { class: 'num', text: String(z.list.length) }),
    h('td', { class: 'num', text: z.best === null ? '—' : String(z.best) }),
    h('td', { class: 'small muted', text: PRINCIPIOS.filter(p => p.comp.includes(z.c.id)).map(p => p.nombre).join(' · ') })));
  view.append(h('div', { class: 'card stack' },
    h('h2', { id: 'tabla-h', text: t('const.tabla') }),
    h('div', { class: 'table-wrap', role: 'region', 'aria-labelledby': 'tabla-h', tabindex: '0' }, h('table', null,
      h('caption', { class: 'sr-only', text: t('const.tablaCaption') }),
      h('thead', null, h('tr', null, h('th', { scope: 'col', text: t('const.col.comp') }), h('th', { scope: 'col', text: t('const.col.n') }), h('th', { scope: 'col', text: t('const.col.best') }), h('th', { scope: 'col', text: t('const.col.principios') }))),
      h('tbody', null, rows2))),
    h('p', { class: 'tiny muted', text: t('aviso.independencia') })));
};

function suggestQuestion(compId) {
  const rol = UI.state.perfil ? UI.state.perfil.rol : 'red';
  const qs = [...ROLE_CONTENT[rol].preguntas, ...COMUNES.filter(q => !q.trampa)];
  return qs.find(q => q.comp[0] === compId) || qs.find(q => q.comp.includes(compId)) || null;
}

function drawHelp(focusTab = true) {
  const dlg = $('#dlg-help');
  const tabs = $('.tabs', dlg);
  tabs.replaceChildren(...HELP_TABS.map((tb, i) => h('button', { class: 'tab', role: 'tab', type: 'button', id: 'tab-' + tb.id, 'aria-selected': String(tb.id === helpTab), 'aria-controls': 'help-panel', tabindex: tb.id === helpTab ? '0' : '-1',
    onclick: () => { helpTab = tb.id; drawHelp(); },
    onkeydown: e => {
      let n = null;
      if (e.key === 'ArrowRight') n = (i + 1) % HELP_TABS.length;
      if (e.key === 'ArrowLeft') n = (i + HELP_TABS.length - 1) % HELP_TABS.length;
      if (e.key === 'Home') n = 0;
      if (e.key === 'End') n = HELP_TABS.length - 1;
      if (n !== null) { e.preventDefault(); helpTab = HELP_TABS[n].id; drawHelp(); }
    } }, icon(tb.ic, 'ic sm'), t('ayuda.tab.' + tb.id))));
  const panel = $('#help-panel', dlg);
  panel.setAttribute('aria-labelledby', 'tab-' + helpTab);
  panel.replaceChildren(h('div', { class: 'prose' }, ...HELP_BUILD[helpTab]()));
  if (focusTab) $('#tab-' + helpTab, dlg).focus();
}

function allGlossary() {
  const out = [...GLOSARIO];
  if (typeof ROLE_CONTENT !== 'undefined') for (const r of ROLES) out.push(...(ROLE_CONTENT[r].glosario || []));
  return out.sort((a, b) => fold(L(a.termino)).localeCompare(fold(L(b.termino))));
}

// Búsqueda Ctrl K / ⌘K sobre historias, preguntas, competencias y glosario. Insensible a acentos.

function searchIndex() {
  const items = [];
  for (const s of UI.state.historias) items.push({ kind: 'historia', ic: 'star', label: s.titulo || t('forja.sinTitulo'), text: [s.titulo, s.s, s.t, s.a, s.r, s.l].join(' '), href: '#forja/' + s.id });
  for (const c of COMPETENCIAS) items.push({ kind: 'competencia', ic: c.icono, label: L({ es: c.es, en: c.en }), text: c.es + ' ' + c.en + ' ' + L(c.des), href: '#constelacion' });
  const qs = [...COMUNES];
  if (typeof ROLE_CONTENT !== 'undefined') for (const r of ROLES) qs.push(...ROLE_CONTENT[r].preguntas);
  for (const q of qs) items.push({ kind: 'pregunta', ic: 'message-square-quote', label: L(q), text: q.es + ' ' + q.en, href: '#arena/pregunta/' + q.id });
  for (const g of allGlossary()) items.push({ kind: 'glosario', ic: 'book-open', label: L(g.termino), text: L(g.termino) + ' ' + L(g.def), help: 'glosario' });
  return items;
}

function searchQuery(q, items) {
  const terms = fold(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const scored = [];
  for (const it of items) {
    const lab = fold(it.label), txt = fold(it.text);
    if (!terms.every(w => txt.includes(w) || lab.includes(w))) continue;
    const s = terms.reduce((n, w) => n + (lab.startsWith(w) ? 3 : lab.includes(w) ? 2 : 1), 0);
    scored.push([s, it]);
  }
  return scored.sort((a, b) => b[0] - a[0]).slice(0, 30).map(x => x[1]);
}

function openSearch(opener) {
  const dlg = $('#dlg-search');
  if (dlg.open) return;
  const items = searchIndex();
  const input = h('input', { type: 'search', id: 'search-input', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'search-results', 'aria-autocomplete': 'list', 'aria-label': t('ui.buscarLargo'), placeholder: t('buscar.ph'), autocomplete: 'off' });
  const list = h('ul', { class: 'results', id: 'search-results', role: 'listbox', 'aria-label': t('buscar.resultados') });
  const status = h('p', { class: 'sr-only', 'aria-live': 'polite' });
  let results = [], sel = 0;
  const choose = it => {
    closeDialog(dlg);
    if (it.help) openHelp(it.help);
    else go(it.href.slice(1));
  };
  const draw = () => {
    results = searchQuery(input.value, items);
    sel = Math.min(sel, Math.max(0, results.length - 1));
    list.replaceChildren(...(results.length ? results.map((it, i) => h('li', { role: 'none' }, h('a', { role: 'option', id: 'sr-' + i, href: it.href || '#', 'aria-selected': String(i === sel), onclick: e => { e.preventDefault(); choose(it); } }, icon(it.ic, 'ic sm'), h('span', { text: it.label }), h('span', { class: 'k', text: t('buscar.k.' + it.kind) }))))
      : [h('li', { class: 'small muted', role: 'none' }, h('p', { class: 'muted', text: input.value.trim() ? t('buscar.nada') : t('buscar.pista') }))]));
    if (results.length) input.setAttribute('aria-activedescendant', 'sr-' + sel); else input.removeAttribute('aria-activedescendant');
    status.textContent = input.value.trim() ? t('buscar.n', { n: results.length }) : '';
  };
  input.addEventListener('input', () => { sel = 0; draw(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(results.length - 1, sel + 1); draw(); $('#sr-' + sel)?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); $('#sr-' + sel)?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter' && results[sel]) { e.preventDefault(); choose(results[sel]); }
    else if (e.key === 'Escape') { e.preventDefault(); closeDialog(dlg); }
  });
  dlg.replaceChildren(h('div', { class: 'dlg' }, h('div', { class: 'search-in' }, icon('search'), input, h('kbd', { text: 'Esc' })), list, status));
  draw();
  openDialog(dlg, opener);
  input.focus();
}
